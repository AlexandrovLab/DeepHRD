[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deephrd"
version = "0.1.0"
description = "CLI wrapper for DeepHRD prediction pipeline."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.23.5",
    "pandas>=2.0.1",
    "torch>=1.13.1",
    "torchvision>=0.14.1",
    "openslide-python>=1.2.0",
    "matplotlib>=3.3.4",
    "Pillow>=9.4.0",
    "scipy>=1.9.1",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.2.2",
    "opencv-python>=4.6.0.66",
    "snorkel>=0.9.9",
]

[project.scripts]
deephrd = "deephrd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deephrd", "deephrd.*"]
